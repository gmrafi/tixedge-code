<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Body -->
  <rect x="30" y="55" width="60" height="50" rx="8" fill="#6366f1"/>
  <!-- Head -->
  <circle cx="60" cy="42" r="22" fill="#fbbf24"/>
  <!-- Hard hat -->
  <ellipse cx="60" cy="28" rx="26" ry="8" fill="#f97316"/>
  <rect x="34" y="20" width="52" height="12" rx="6" fill="#f97316"/>
  <!-- Eyes -->
  <circle cx="52" cy="40" r="4" fill="white"/>
  <circle cx="68" cy="40" r="4" fill="white"/>
  <circle cx="53" cy="41" r="2" fill="#1a1a2e"/>
  <circle cx="69" cy="41" r="2" fill="#1a1a2e"/>
  <!-- Smile -->
  <path d="M50 52 Q60 60 70 52" stroke="#1a1a2e" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Arms -->
  <rect x="10" y="58" width="22" height="10" rx="5" fill="#6366f1" transform="rotate(-15 10 58)"/>
  <rect x="90" y="55" width="22" height="10" rx="5" fill="#6366f1" transform="rotate(15 90 55)"/>
  <!-- Tool (wrench) in right hand -->
  <rect x="106" y="48" width="6" height="18" rx="3" fill="#94a3b8" transform="rotate(30 106 48)"/>
  <!-- Legs -->
  <rect x="38" y="100" width="16" height="18" rx="6" fill="#4f46e5"/>
  <rect x="66" y="100" width="16" height="18" rx="6" fill="#4f46e5"/>
  <!-- Boots -->
  <rect x="35" y="112" width="22" height="8" rx="4" fill="#1e1b4b"/>
  <rect x="63" y="112" width="22" height="8" rx="4" fill="#1e1b4b"/>
  <!-- Pocket badge "B" -->
  <rect x="51" y="65" width="18" height="14" rx="4" fill="white" opacity="0.3"/>
  <text x="55" y="76" font-family="Arial" font-size="10" font-weight="bold" fill="white">B</text>
</svg>
